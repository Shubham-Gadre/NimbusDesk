name: NimbusDesk CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore NimbusDesk.sln

      - name: Build
        run: dotnet build NimbusDesk.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test NimbusDesk.sln --no-build --configuration Release --verbosity normal
